name: tryzeon-app-dev

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # The S3 gateway answers before the volume server has registered with the
      # master; reads in that window fail with "volume not found".
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz && wget -qO- http://127.0.0.1:9333/dir/status | grep -q '\"DataNodes\":\\[{'"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.6.7
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  srh:
    image: hiett/serverless-redis-http:0.0.10
    environment:
      SRH_MODE: env
      SRH_TOKEN: tryzeon-dev-redis
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "8079:80"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  seaweedfs-data:
  redis-data:
