project_id = "tryzeon-app"

[functions.revenuecat-webhook]
verify_jwt = false

[functions.short-links]
verify_jwt = false

# The CORS preflight carries no Authorization header, so gateway-level JWT
# verification would reject it before the function runs. The real check is
# `getAuthenticatedUserClient()`'s `auth.getUser()`, which 401s without a valid
# token — same as every other browser-reachable function here.
[functions.tryon]
verify_jwt = false

[functions.chat]
verify_jwt = false

[functions.line-webhook]
verify_jwt = false

[functions.line-auth]
verify_jwt = false

# Local dev only; prod's templates are set in the dashboard. The app signs in
# with the 6-digit code, which the CLI's default templates leave out.
[auth.email.template.magic_link]
subject = "Tryzeon 驗證碼"
content_path = "./supabase/templates/otp.html"
