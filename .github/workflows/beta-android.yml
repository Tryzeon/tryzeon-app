name: Beta - Android
run-name: Beta - Android ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version for this testing build, for example 1.2.0
        required: true
        type: string

env:
  BUNDLE_PATH: vendor/bundle

permissions:
  contents: read

jobs:
  build-and-deploy-android-beta:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Install Fastlane
        run: |
          cd android
          bundle install

      - name: Create env files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUE_CAT_API_KEY: ${{ secrets.REVENUE_CAT_GOOGLE_API_KEY }}
          R2_PUBLIC_IMAGES_BASE_URL: ${{ secrets.R2_PUBLIC_IMAGES_BASE_URL }}
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "REVENUE_CAT_API_KEY=$REVENUE_CAT_API_KEY"
            echo "R2_PUBLIC_IMAGES_BASE_URL=$R2_PUBLIC_IMAGES_BASE_URL"
          } > .env
          cp .env.example .env.local

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure Keystore
        env:
          PLAYSTORE_KEYSTORE_BASE64: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
          PLAYSTORE_KEYSTORE_PASSWORD: ${{ secrets.PLAYSTORE_KEYSTORE_PASSWORD }}
          PLAYSTORE_KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
          PLAYSTORE_KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
        run: |
          echo "$PLAYSTORE_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$PLAYSTORE_KEYSTORE_PASSWORD"
            echo "keyPassword=$PLAYSTORE_KEY_PASSWORD"
            echo "keyAlias=$PLAYSTORE_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Deploy to Play internal testing
        run: |
          cd android
          bundle exec fastlane beta
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PLAYSTORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}

      - name: Clean up signing files
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
