name: Beta - iOS
run-name: Beta - iOS ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version for this TestFlight train, for example 1.2.0
        required: true
        type: string

env:
  BUNDLE_PATH: vendor/bundle

permissions:
  contents: read

jobs:
  build-and-deploy-ios-beta:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Create env files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUE_CAT_API_KEY: ${{ secrets.REVENUE_CAT_APPLE_API_KEY }}
          R2_PUBLIC_IMAGES_BASE_URL: ${{ secrets.R2_PUBLIC_IMAGES_BASE_URL }}
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "REVENUE_CAT_API_KEY=$REVENUE_CAT_API_KEY"
            echo "R2_PUBLIC_IMAGES_BASE_URL=$R2_PUBLIC_IMAGES_BASE_URL"
          } > .env
          cp .env.example .env.local

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install Bundle
        run: |
          cd ios
          bundle install

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install FlutterFire CLI
        run: dart pub global activate flutterfire_cli 1.4.1

      - name: Configure Xcode project (Flutter)
        run: flutter build ios --release --config-only --no-codesign

      - name: Build and deploy to TestFlight
        run: |
          cd ios
          bundle exec fastlane beta
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain fastlane_tmp_keychain 2>/dev/null || true
          security list-keychains -d user -s ~/Library/Keychains/login.keychain-db
